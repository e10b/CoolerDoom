<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>room</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      color: #ccc;
      font: 14px sans-serif;
    }
    #status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="doom-canvas" width="640" height="400" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module" src="index.js"></script>
</body>
</html>
