<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolerDoom</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      display: grid;
      place-items: center;
    }

    #canvas {
      display: block;
      width: min(960px, calc(100vw - 48px), calc((100vh - 48px) * 1.6));
      aspect-ratio: 8 / 5;
      border: 0;
      outline: 0;
      background: #000;
      cursor: none;
      image-rendering: pixelated;
    }

    #console {
      position: fixed;
      right: 16px;
      bottom: 60px;
      width: min(560px, calc(100vw - 32px));
      height: min(240px, calc(100vh - 92px));
      box-sizing: border-box;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid #2f2f2f;
      border-radius: 5px;
      background: rgba(17, 17, 17, 0.97);
      color: #c8c8c8;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #console[hidden] {
      display: none;
    }

    #console-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 36px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #383838;
      border-radius: 5px;
      background: #161616;
      color: #aaa;
      cursor: pointer;
    }

    #console-toggle:hover,
    #console-toggle[aria-expanded="true"] {
      border-color: #555;
      background: #222;
      color: #ddd;
    }

    #console-toggle svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <pre id="console" aria-live="polite" hidden></pre>
  <button id="console-toggle" type="button" title="Console" aria-label="Toggle debug console" aria-controls="console" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 7l4 4-4 4M11 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <script>
    const canvas = document.getElementById("canvas");
    const consoleOutput = document.getElementById("console");
    const consoleToggle = document.getElementById("console-toggle");

    function writeConsole(args, writer) {
      const text = args.join(" ");
      writer(text);
      consoleOutput.append(document.createTextNode(text + "\n"));
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    var Module = {
      canvas,
      print: (...args) => writeConsole(args, console.log),
      printErr: (...args) => writeConsole(args, console.error),
      setStatus: () => {}
    };

    consoleToggle.addEventListener("click", () => {
      const opening = consoleOutput.hidden;
      consoleOutput.hidden = !opening;
      consoleToggle.setAttribute("aria-expanded", String(opening));
      if (!opening) canvas.focus();
    });
    Module.canvas.addEventListener("pointerdown", () => Module.canvas.focus());
    Module.canvas.focus();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
