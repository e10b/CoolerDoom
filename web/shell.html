<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolerDoom</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: 0;
      background: #000;
      cursor: none;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById("canvas"),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: () => {}
    };
    Module.canvas.addEventListener("pointerdown", () => Module.canvas.focus());
    Module.canvas.focus();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
